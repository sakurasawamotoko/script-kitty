name: Deploy Nyankoronikki Discord Bot

on:
  push:
    branches:
      - main   # メインブランチにpushされたら自動デプロイ
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: nyankoronikki
  ECS_CLUSTER: nyankoronikki-cluster
  ECS_SERVICE: nyankoronikki-service
  CONTAINER_NAME: nyankoronikki-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        run: |
          aws ecr describe-repositories --repository-names nyankoronikki || \
          aws ecr create-repository --repository-name nyankoronikki
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nyankoronikki:${GITHUB_SHA}
          docker build -f infra/にゃんころ/Dockerfile infra/にゃんころ -t $IMAGE_URI
          docker push $IMAGE_URI

      - name: Update ECS task definition
        id: ecs-task
        run: |
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition ${{ env.ECS_SERVICE }})
          NEW_TASK_DEF=$(echo $TASK_DEF_JSON | jq --arg IMAGE "$STEP_REGISTRY/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}" '.taskDefinition | .containerDefinitions[0].image = $IMAGE | {family, containerDefinitions, cpu, memory, networkMode, requiresCompatibilities, executionRoleArn}')
          echo "$NEW_TASK_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Update ECS service
        run: |
          LATEST_TASK_DEF=$(aws ecs describe-task-definition --task-definition ${{ env.ECS_SERVICE }} | jq -r '.taskDefinition.taskDefinitionArn')
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --task-definition $LATEST_TASK_DEF
