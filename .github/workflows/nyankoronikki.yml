name: Terraform Plan (nyankoronikki)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/**

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Terraformをセットアップ
      # Set up Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Terraform初期化
      # Terraform init
      - name: Terraform Init
        working-directory: infra
        run: terraform init

      # Terraformプラン（Secrets使用）
      # Terraform plan using GitHub Actions secrets
      - name: Terraform Plan
        working-directory: infra
        env:
          CONTAINER_IMAGE: ${{ secrets.CONTAINER_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
        run: |
          terraform plan \
            -var="container_image=${CONTAINER_IMAGE}" \
            -var="openai_api_key=${OPENAI_API_KEY}" \
            -var="pinecone_api_key=${PINECONE_API_KEY}" \
            -var="pinecone_environment=${PINECONE_ENVIRONMENT}" \
            -lock=false
