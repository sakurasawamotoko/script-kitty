# .github/workflows/nyankoronikki.yml
name: CI/CD - にゃんころ日記 Fargate

on:
  push:
    paths:
      - "にゃんころ日記/**"
      - ".github/workflows/nyankoronikki.yml"
    branches: [main, 'feature/**']
  pull_request:
    paths:
      - "にゃんころ日記/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      CONTAINER_IMAGE: nyankoronikki

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push Docker image
        run: |
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:${GITHUB_SHA}
          cd にゃんころ日記
          docker build -f Dockerfile . -t $IMAGE_URI
          docker push $IMAGE_URI

      - name: Terraform Init
        run: |
          cd にゃんころ日記
          terraform init -reconfigure

      - name: Terraform Plan
        run: |
          cd にゃんころ日記
          terraform plan \
            -var="container_image=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:${GITHUB_SHA}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var="pinecone_environment=${{ secrets.PINECONE_ENVIRONMENT }}" \
            -lock=false

      - name: Terraform Apply
        run: |
          cd にゃんころ日記
          terraform apply \
            -var="container_image=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:${GITHUB_SHA}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var="pinecone_environment=${{ secrets.PINECONE_ENVIRONMENT }}" \
            -lock=false -auto-approve
