name: nyankoronikki Fargate Deploy

on:
  push:
    branches:
      - main
      - feature/nyankoronikki-fargate
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.2

      - name: Terraform Init
        run: terraform init -backend-config="bucket=scriptkitty-terraform-state-bucket" -backend-config="key=scriptkitty/nyankoronikki/terraform.tfstate" -backend-config="region=ap-northeast-1" -reconfigure

      - name: Terraform Plan
        run: |
          terraform plan \
            -var "container_image=${{ secrets.CONTAINER_IMAGE }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var "pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var "pinecone_environment=${{ secrets.PINECONE_ENVIRONMENT }}" \
            -lock=false

      - name: Terraform Apply
        run: |
          terraform apply \
            -var "container_image=${{ secrets.CONTAINER_IMAGE }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var "pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var "pinecone_environment=${{ secrets.PINECONE_ENVIRONMENT }}" \
            -lock=false \
            -auto-approve
