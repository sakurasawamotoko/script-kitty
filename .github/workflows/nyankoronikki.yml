# .github/workflows/nyankoronikki.yml
name: CI/CD - にゃんころ日記 Fargate

on:
  push:
    paths:
      - "にゃんころ日記/**"
      - "infra/**"
      - ".github/workflows/nyankoronikki.yml"
    branches: [main, 'feature/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      CONTAINER_IMAGE: nyankoronikki
      CLUSTER_NAME: nyankoronikki-cluster
      SERVICE_NAME: nyankoronikki-service
      TASK_DEFINITION_NAME: nyankoronikki-task
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      

    steps:
      - uses: actions/checkout@v3

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # Set up Terraform for infra
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Terraform Init & Apply
        run: |
          cd infra/にゃんころ日記
          terraform init -reconfigure
          terraform apply \
            -var="container_image=${CONTAINER_IMAGE}" \
            -var="openai_api_key=${OPENAI_API_KEY}" \
            -var="pinecone_api_key=${PINECONE_API_KEY}" \
            -var="pinecone_environment=${PINECONE_ENVIRONMENT}" \
            -var="discord_bot_token=${DISCORD_BOT_TOKEN}" \
            -var="discord_guild_id=${DISCORD_GUILD_ID}" \
            -auto-approve

      # Ensure ECR repo exists
      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names ${CONTAINER_IMAGE} || \
          aws ecr create-repository --repository-name ${CONTAINER_IMAGE}

      - uses: aws-actions/amazon-ecr-login@v1

      # Build & push Docker image
      - name: Build & Push Docker image
        run: |
          IMAGE_URI_SHA=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:${GITHUB_SHA}
          IMAGE_URI_LATEST=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:latest

          docker build -f にゃんころ日記/Dockerfile にゃんころ日記 -t $IMAGE_URI_SHA -t $IMAGE_URI_LATEST
          docker push $IMAGE_URI_SHA
          docker push $IMAGE_URI_LATEST

      # Update ECS Fargate service
      - name: Deploy to ECS Fargate
        run: |
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CONTAINER_IMAGE}:${GITHUB_SHA}

          TASK_DEFINITION_JSON=$(aws ecs register-task-definition \
            --family ${TASK_DEFINITION_NAME} \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu "512" \
            --memory "1024" \
            --execution-role-arn ${TASK_EXECUTION_ROLE_ARN} \
            --container-definitions "[{\"name\":\"${CONTAINER_IMAGE}\",\"image\":\"${IMAGE_URI}\",\"essential\":true,\"portMappings\":[{\"containerPort\":80,\"protocol\":\"tcp\"}]}]" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition ARN: $TASK_DEFINITION_JSON"

          # Update ECS service
          aws ecs update-service \
            --cluster ${CLUSTER_NAME} \
            --service ${SERVICE_NAME} \
            --task-definition $TASK_DEFINITION_JSON

          aws ecs wait services-stable \
            --cluster ${CLUSTER_NAME} \
            --services ${SERVICE_NAME}
