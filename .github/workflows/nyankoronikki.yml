name: nyankoronikki Fargate Deploy

on:
  push:
    branches:
      - main
      - feature/nyankoronikki-fargate
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.2

      - name: Terraform Init
        working-directory: infra/にゃんころ日記
        run: |
          terraform init -reconfigure

      - name: Terraform Plan
        working-directory: infra/にゃんころ日記
        env:
          CONTAINER_IMAGE: ${{ secrets.CONTAINER_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
        run: |
          terraform plan \
            -var="container_image=${CONTAINER_IMAGE}" \
            -var="openai_api_key=${OPENAI_API_KEY}" \
            -var="pinecone_api_key=${PINECONE_API_KEY}" \
            -var="pinecone_environment=${PINECONE_ENVIRONMENT}"

            
      - name: Terraform Apply
        run: |
          terraform apply \
            -var "container_image=${{ secrets.CONTAINER_IMAGE }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var "pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var "pinecone_environment=${{ secrets.PINECONE_ENVIRONMENT }}" \
            -lock=false \
            -auto-approve
