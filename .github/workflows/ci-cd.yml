name: CI/CD - にゃんころ Service

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      SCRIPT_KITTY_OPENAI_KEY: ${{ secrets.SCRIPT_KITTY_OPENAI_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: us-west-2

    steps:
      # --- Checkout the repo ---
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Set up Python (for tests) ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # --- Install Poetry for dependency management ---
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # --- Install project dependencies ---
      - name: Install dependencies
        run: |
          cd にゃんころ
          poetry install --no-dev

      # --- Run tests ---
      - name: Run pytest
        run: |
          cd にゃんころ
          poetry run pytest -v

      # --- Set up Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- Log in to ECR ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # --- Build and push Docker image ---
      - name: Build, tag, and push Docker image to ECR
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nyankoro:latest
          docker build -f にゃんころ/Dockerfile にゃんころ -t $IMAGE_URI
          docker push $IMAGE_URI

      # --- Deploy to Lambda ---
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name nyankoro-lambda \
            --image-uri $IMAGE_URI
