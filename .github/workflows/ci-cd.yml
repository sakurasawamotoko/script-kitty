name: CI/CD - にゃんころ Service

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      SCRIPT_KITTY_OPENAI_KEY: ${{ secrets.SCRIPT_KITTY_OPENAI_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ap-northeast-1

    steps:
      # --- Checkout the repo ---
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Set up Python (for tests if needed) ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # --- Install Poetry for dependency management ---
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # --- Install project dependencies (optional for CI) ---
      - name: Install dependencies
        run: |
          cd にゃんころ
          poetry install --no-dev --no-interaction --no-ansi

      # --- Build, tag, and push Docker image to ECR ---
      - name: Build, tag, and push Docker image to ECR
        run: |
          cd にゃんころ
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nyankoro:$IMAGE_TAG
          docker build -f Dockerfile . -t $IMAGE_URI
          docker push $IMAGE_URI

      # --- Deploy to Lambda ---
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name nyankoro-lambda \
            --image-uri $IMAGE_URI
