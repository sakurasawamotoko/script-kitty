name: CI/CD - にゃんころ Service

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      SCRIPT_KITTY_OPENAI_KEY: ${{ secrets.SCRIPT_KITTY_OPENAI_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ap-northeast-1
      LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}

    steps:
      # --- Checkout the repo ---
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Set up Python ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # --- Install Poetry ---
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # --- Install project dependencies ---
      - name: Install dependencies
        run: |
          cd にゃんころ
          poetry install --no-interaction --no-ansi --no-root

      # --- Set up Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- Log in to ECR ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # --- Build and push Docker image ---
      - name: Build, tag, and push Docker image to ECR
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nyankoro:$IMAGE_TAG
          docker build -f にゃんころ/Dockerfile にゃんころ -t $IMAGE_URI
          docker push $IMAGE_URI

      # --- Deploy to Lambda (create if not exists) ---
      - name: Deploy to Lambda
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nyankoro:$GITHUB_SHA
          FUNCTION_NAME="nyankoro-lambda"

          # Check if function exists
          if ! aws lambda get-function --function-name $FUNCTION_NAME; then
            echo "Lambda function not found. Creating..."
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role ${{ env.LAMBDA_EXECUTION_ROLE_ARN }}
          else
            echo "Lambda exists. Updating image..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI
          fi
